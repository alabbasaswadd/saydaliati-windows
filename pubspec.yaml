name: saydaliati
description: "صيدليتي — تطبيق إدارة صيدلية (نقطة بيع ومخزون)."
publish_to: 'none'
version: 1.2.0+15

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Arabic / RTL Material localizations.
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # State management + DI (Riverpod) with code generation.
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Declarative, URL-based navigation.
  go_router: ^17.5.0

  # Immutable models / sealed unions.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Networking.
  dio: ^5.11.0

  # Fast, non-sensitive flags (session presence, intro seen) read on the startup
  # path so the splash never blocks on the slow Keystore-backed secure storage.
  shared_preferences: ^2.3.0

  # Secure token storage. Pinned to 9.x: the 11.x Android package now requires
  # compileSdk 37, which the current toolchain (AGP 9.1.0 / SDK 36) doesn't
  # target. 9.x builds against SDK 36 and is API-compatible for our use.
  flutter_secure_storage: ^9.2.2

  # Logging.
  logger: ^2.7.0

  # Client-generated ids (outbox idempotency).
  uuid: ^4.6.0

  # Offline-first: connectivity + local SQLite cache / write queue.
  connectivity_plus: ^7.3.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1

  # Invoice PDF generation + share/print (Arabic fonts fetched via PdfGoogleFonts).
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^10.1.4

  # Interactive first-run onboarding (dim overlay + spotlight on a target).
  tutorial_coach_mark: ^1.3.0

  # Open external links (official site / Telegram / Facebook) from the About page.
  url_launcher: ^6.3.1

  # Native window control (hide title bar, minimize/maximize/close, drag-to-move)
  # for the custom desktop title bar.
  window_manager: ^0.4.0
  # تابعٌ لـwindow_manager أصلاً، ويُعلَن صراحةً لأن main.dart يقرأ منه مقاس
  # الشاشة ليُلائم النافذة لها.
  screen_retriever: ^0.2.0

  path_provider: ^2.1.5
  trina_grid: ^2.2.1

  # Dashboard charts (sales trend / top medicines).
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  drift_dev: ^2.34.5
  flutter_launcher_icons: ^0.14.4

# App launcher icon (Saydaliati logo). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FCFBF8"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  # نسخة ويندوز كانت تحمل أيقونة Flutter الافتراضية: هذا القسم لم يكن موجوداً
  # فلم يُولَّد `windows/runner/resources/app_icon.ico` من الشعار أصلاً.
  # و256px هو أكبر مقاس يستعمله ويندوز (أيقونة سطح المكتب الكبيرة).
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Cairo-Variable.ttf
    - assets/icon/app_icon.png

  # Cairo (Arabic-first) as the app font — a single variable-weight TTF.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
